<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANNAT Birthday</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
}

.screen{
    position:relative;
    z-index:5;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.text{
    color:white;
    opacity:0;
}

.intro{
    font-size:clamp(25px,7vw,50px);
    font-weight:bold;
    letter-spacing:5px;
    text-shadow:0 0 20px #fff,0 0 40px #ff69b4;
}

.name{
    font-size:clamp(70px,24vw,180px);
    font-weight:900;
    letter-spacing:8px;
    color:white;
    text-shadow:
    0 0 10px white,
    0 0 25px #ff69b4,
    0 0 50px #ff1493,
    0 0 100px #ff1493;
}

.birthday{
    font-size:clamp(35px,10vw,75px);
    font-weight:900;
    letter-spacing:4px;
    color:white;
    text-shadow:
    0 0 15px white,
    0 0 35px #ff1493;
}

.cake{
    font-size:90px;
}

.wishes{
    font-size:clamp(21px,5.5vw,40px);
    font-weight:bold;
    line-height:1.8;
    color:white;
    text-shadow:0 0 15px #ff69b4;
}

.line{
    opacity:0;
    transform:translateY(30px);
    margin:5px 0;
}

.final{
    font-size:clamp(25px,7vw,48px);
    font-weight:bold;
    line-height:1.7;
    color:white;
    text-shadow:
    0 0 15px white,
    0 0 35px #ff1493;
}

.show{
    animation:show 1.2s ease forwards;
}

.letter{
    display:inline-block;
    opacity:0;
    transform:translateY(40px) scale(.5);
    animation:letter 0.5s forwards;
}

@keyframes show{

    from{
        opacity:0;
        transform:translateY(40px) scale(.8);
        filter:blur(12px);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }

}

@keyframes letter{

    0%{
        opacity:0;
        transform:translateY(50px) scale(.4);
        filter:blur(10px);
    }

    70%{
        opacity:1;
        transform:translateY(-8px) scale(1.08);
        filter:blur(0);
    }

    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

</style>

</head>

<body>

<canvas id="stars"></canvas>

<div class="screen" id="screen">

    <div class="text intro" id="intro">
        ✨ A SPECIAL SURPRISE ✨
    </div>

    <div class="text name" id="name"></div>

    <div class="text birthday" id="birthday">
        🎉 HAPPY BIRTHDAY 🎉
    </div>

    <div class="text cake" id="cake">
        🎂
    </div>

    <div class="wishes" id="wishes">

        <div class="line">
            💖 May you always be happy 💖
        </div>

        <div class="line">
            🌸 May your dreams come true 🌸
        </div>

        <div class="line">
            ✨ May your life be beautiful ✨
        </div>

        <div class="line">
            😊 Keep smiling always 😊
        </div>

    </div>

    <div class="final" id="final">
        💕 WITH LOTS OF GOOD WISHES 💕
        <br>
        ✨ JANNAT ✨
    </div>

</div>


<script>

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){

    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* STAR PARTICLES */

let stars=[];

for(let i=0;i<180;i++){

    stars.push({

        x:Math.random()*W,

        y:Math.random()*H,

        r:Math.random()*2+0.5,

        speed:Math.random()*0.8+0.2,

        alpha:Math.random()

    });

}


function animateStars(){

    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,W,H);

    stars.forEach(s=>{

        s.y+=s.speed;

        if(s.y>H){

            s.y=0;
            s.x=Math.random()*W;

        }

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            "rgba(255,255,255,"+
            s.alpha+
            ")";

        ctx.shadowBlur=12;

        ctx.shadowColor="#ff69b4";

        ctx.fill();

    });

    requestAnimationFrame(animateStars);

}

animateStars();


/* DELAY FUNCTION */

function wait(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}


/* SHOW TEXT */

async function showElement(id){

    const el=document.getElementById(id);

    el.classList.add("show");

    await wait(1800);

}


/* LETTER BY LETTER */

async function showName(){

    const name=document.getElementById("name");

    name.innerHTML="";

    name.classList.add("show");

    const letters="JANNAT";

    for(let i=0;i<letters.length;i++){

        const span=document.createElement("span");

        span.className="letter";

        span.style.animationDelay=
            (i*0.35)+"s";

        span.textContent=letters[i];

        name.appendChild(span);

        await wait(350);

    }

    await wait(1800);

}


/* WISH LINES ONE BY ONE */

async function showWishes(){

    const lines=
        document.querySelectorAll(".line");

    for(let i=0;i<lines.length;i++){

        lines[i].style.animation=
            "show 1s ease forwards";

        await wait(1400);

    }

}


/* MAIN ANIMATION */

async function start(){

    await wait(1000);

    await showElement("intro");

    document.getElementById("intro").style.display="none";

    await showName();

    document.getElementById("name").style.display="none";

    await showElement("birthday");

    await wait(1000);

    document.getElementById("birthday").style.display="none";

    await showElement("cake");

    await wait(1800);

    document.getElementById("cake").style.display="none";

    await showWishes();

    await wait(1800);

    document.getElementById("wishes").style.display="none";

    await showElement("final");

}

start();

</script>

</body>

</html>
